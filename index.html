<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEONODE ACADEMY | Student HUD v3.0</title>
    <style>
        /* 🎨 Premium Dark Obsidian & Emerald Green HUD Styling */
        body {
            background-color: #0b0f12; /* Dark Obsidian */
            color: #e2e8f0; /* Slate Grey text */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none; /* 🔒 CSS Level Anti-Select Protection */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        .hud-container {
            background: linear-gradient(145deg, #111820, #070a0d);
            border: 2px solid #10b981; /* Emerald Green Neon Border */
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
            padding: 40px;
            border-radius: 12px;
            width: 450px;
            text-align: center;
        }
        h1 {
            color: #10b981;
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: #10b981;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }
        .btn-hud {
            background-color: #10b981;
            color: #0b0f12;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-hud:hover {
            background-color: #059669;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <h1>Leonode Academy</h1>
        <p>Free Scholarship Application Form v3.0</p>
        
        <form id="scholarshipForm" onsubmit="event.preventDefault(); alert('NK POWER: Application Form Saved Domestically!');">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Academic Core Field</label>
                <input type="text" placeholder="e.g. Relational DB / Geo-Forensics" required autocomplete="off">
            </div>
            <button type="submit" class="btn-hud">Submit Scholarship Request</button>
        </form>
    </div>

    <!-- 🔒 Hacker-Proof Security Core: Active Code & Context Blocking -->
    <script>
        // 1. റൈറ്റ് ക്ലിക്ക് കംപ്ലീറ്റ്ലി ലോക്ക് ചെയ്യാൻ!
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. കീബോർഡ് വഴിയുള്ള എല്ലാ മോഷ്ടിക്കൽ റൂട്ടുകളും കൊട്ടിയടയ്ക്കാൻ!
        document.addEventListener('keydown', function(e) {
            // F12, Ctrl+Shift+I, Ctrl+Shift+C (DevTools) ബ്ലോക്ക്
            if (e.keyCode == 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67)) || 
                (e.ctrlKey && e.keyCode == 85)) { // Ctrl+U (View Source) ബ്ലോക്ക്
                e.preventDefault();
                return false;
            }
            // Ctrl+C, Ctrl+X, Ctrl+S (Copy, Cut, Save) ഫ്രീ ഫോമിൽ നിന്ന് തടയാൻ!
            if (e.ctrlKey && (e.keyCode == 67 || e.keyCode == 88 || e.keyCode == 83)) {
                alert("NK POWER: Leonode Academy Security Lock Active! 🔒 No Copy Allowed.");
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
